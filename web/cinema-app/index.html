<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PAPPY CINEMA ×͜× • Live Stream Remote</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cinema: {
              red: '#E50914',
              gold: '#FFB800',
              bg: '#0F0E17',
              card: '#1B1926',
              border: '#2E2B40'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0F0E17;
      color: #FFFFFE;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      padding-bottom: env(safe-area-inset-bottom, 24px);
    }
    .ripple-animate {
      animation: ripple 0.6s cubic-bezier(0, 0, 0.2, 1) forwards;
    }
    @keyframes ripple {
      0% { opacity: 0.8; transform: scale(0.6); }
      100% { opacity: 0; transform: scale(1.6); }
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#0F0E17] text-white antialiased overflow-x-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // Telegram Haptics Helper
    const haptic = (type = 'medium') => {
      try {
        if (window.Telegram?.WebApp?.HapticFeedback) {
          if (type === 'selection') window.Telegram.WebApp.HapticFeedback.selectionChanged();
          else window.Telegram.WebApp.HapticFeedback.impactOccurred(type);
        }
      } catch (e) {}
    };

    // Format seconds to mm:ss
    const formatTime = (seconds = 0) => {
      const s = Math.max(0, Math.round(seconds));
      const m = Math.floor(s / 60);
      const rem = s % 60;
      return `${m}:${String(rem).padStart(2, '0')}`;
    };

    function App() {
      const [destToken, setDestToken] = useState('');
      const [destination, setDestination] = useState(null);
      const [activeTab, setActiveTab] = useState('home'); // home | movies | tv | search | queue
      const [homeData, setHomeData] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [searchResults, setSearchResults] = useState([]);
      const [searchLoading, setSearchLoading] = useState(false);
      const [selectedItem, setSelectedItem] = useState(null);
      const [itemDetails, setItemDetails] = useState(null);
      const [tvSeasons, setTvSeasons] = useState([]);
      const [selectedSeason, setSelectedSeason] = useState(1);
      const [seasonEpisodes, setSeasonEpisodes] = useState([]);
      const [playbackStatus, setPlaybackStatus] = useState(null);
      const [queueItems, setQueueItems] = useState([]);
      const [fullRemoteOpen, setFullRemoteOpen] = useState(false);
      const [feedbackRipple, setFeedbackRipple] = useState(null); // { side: 'left'|'right', text: '-10s'|'+10s' }
      const [loading, setLoading] = useState(true);

      const API_BASE = window.location.origin;

      // Initialize Telegram WebApp & Destination Token
      useEffect(() => {
        try {
          if (window.Telegram?.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            window.Telegram.WebApp.setHeaderColor('#0F0E17');
            window.Telegram.WebApp.setBackgroundColor('#0F0E17');
          }
        } catch (e) {}

        const params = new URLSearchParams(window.location.search);
        const token = params.get('dest') || window.Telegram?.WebApp?.initDataUnsafe?.start_param || '';
        setDestToken(token);

        if (token) {
          fetch(`${API_BASE}/cinema/api/destination?dest=${encodeURIComponent(token)}`)
            .then(r => r.json())
            .then(res => {
              if (res.ok) setDestination(res.destination);
            })
            .catch(() => {});
        }

        // Load Home Feed
        fetch(`${API_BASE}/cinema/api/home`)
          .then(r => r.json())
          .then(res => {
            if (res.ok) setHomeData(res.data);
            setLoading(false);
          })
          .catch(() => setLoading(false));
      }, []);

      // Authoritative Playback Status Polling (every 3 seconds)
      useEffect(() => {
        if (!destToken) return;
        const fetchStatus = () => {
          fetch(`${API_BASE}/cinema/api/status?dest=${encodeURIComponent(destToken)}`)
            .then(r => r.json())
            .then(res => {
              if (res.ok) {
                setPlaybackStatus(res.session);
                if (res.poll) setPollData(res.poll);
              }
            })
            .catch(() => {});
        };

        fetchStatus();
        const interval = setInterval(fetchStatus, 3000);
        return () => clearInterval(interval);
      }, [destToken]);

      // Queue Fetch
      const refreshQueue = () => {
        if (!destToken) return;
        fetch(`${API_BASE}/cinema/api/queue?dest=${encodeURIComponent(destToken)}`)
          .then(r => r.json())
          .then(res => {
            if (res.ok) setQueueItems(res.queue || []);
          })
          .catch(() => {});
      };

      useEffect(() => {
        if (activeTab === 'queue' || fullRemoteOpen) refreshQueue();
      }, [activeTab, fullRemoteOpen, destToken]);

      // Debounced Search
      useEffect(() => {
        if (!searchQuery.trim()) {
          setSearchResults([]);
          return;
        }
        setSearchLoading(true);
        const timer = setTimeout(() => {
          fetch(`${API_BASE}/cinema/api/search?q=${encodeURIComponent(searchQuery)}&type=all`)
            .then(r => r.json())
            .then(res => {
              const list = res.data?.results || res.data || [];
              setSearchResults(Array.isArray(list) ? list : []);
              setSearchLoading(false);
            })
            .catch(() => setSearchLoading(false));
        }, 350);
        return () => clearTimeout(timer);
      }, [searchQuery]);

      // Load Item Details when clicked
      const openDetails = (item) => {
        haptic('selection');
        setSelectedItem(item);
        setItemDetails(null);
        setSeasonEpisodes([]);
        const id = item.provider_id || item.id;
        const type = item.type || (item.first_air_date ? 'tv' : 'movie');

        fetch(`${API_BASE}/cinema/api/details?type=${type}&id=${id}`)
          .then(r => r.json())
          .then(res => {
            if (res.ok) {
              setItemDetails(res.data);
              if (type === 'tv') {
                loadEpisodes(id, 1);
              }
            }
          });
      };

      const loadEpisodes = (id, seasonNum) => {
        setSelectedSeason(seasonNum);
        fetch(`${API_BASE}/cinema/api/tv/season?id=${id}&season=${seasonNum}`)
          .then(r => r.json())
          .then(res => {
            if (res.ok) {
              const eps = res.data?.episodes || res.data || [];
              setSeasonEpisodes(Array.isArray(eps) ? eps : []);
            }
          });
      };

      // Remote Commands
      const sendRemoteCommand = (action, params = {}) => {
        haptic('medium');
        if (!destToken) return;
        fetch(`${API_BASE}/cinema/api/remote/control`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ dest: destToken, action, ...params })
        })
          .then(r => r.json())
          .then(res => {
            if (res.ok && res.state) {
              setPlaybackStatus(prev => prev ? { ...prev, state: res.state } : prev);
            }
            if (res.ok && res.position !== undefined) {
              setPlaybackStatus(prev => prev ? { ...prev, position: res.position } : prev);
            }
          })
          .catch(() => {});
      };

      // Double-Tap Fast Forward & Rewind Gesture Handler
      const lastTapRef = useRef({ time: 0, x: 0 });
      const handlePlayerDoubleTap = (e) => {
        const now = Date.now();
        const rect = e.currentTarget.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const width = rect.width;
        const isLeft = x < width / 2;

        if (now - lastTapRef.current.time < 350) {
          // Double Tap Triggered!
          const delta = isLeft ? -10 : 10;
          haptic('heavy');
          sendRemoteCommand('seek_delta', { delta });
          setFeedbackRipple({ side: isLeft ? 'left' : 'right', text: isLeft ? '-10s' : '+10s' });
          setTimeout(() => setFeedbackRipple(null), 600);
          lastTapRef.current.time = 0;
        } else {
          lastTapRef.current = { time: now, x };
        }
      };

      // Direct Play Stream Action
      const handlePlayNowAction = (item, season = null, episode = null) => {
        haptic('success');
        if (!destToken) {
          alert('Please open the Mini App via your Telegram destination link.');
          return;
        }
        const id = item.provider_id || item.id;
        const type = item.type || (item.first_air_date ? 'tv' : 'movie');
        const title = item.title || item.name;

        fetch(`${API_BASE}/cinema/api/play`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            dest: destToken,
            mediaType: type,
            mediaId: id,
            title,
            season,
            episode
          })
        })
          .then(r => r.json())
          .then(res => {
            if (res.ok) {
              refreshStatus();
              alert(`▶️ Now streaming "${title}" to your Telegram Channel!`);
              setFullRemoteOpen(true);
            } else {
              alert(`Could not start stream: ${res.message || res.error}`);
            }
          })
          .catch(err => alert(`Playback error: ${err.message}`));
      };

      // Queue an item
      const handleQueueAction = (item, playNext = false, season = null, episode = null) => {
        haptic('success');
        if (!destToken) return;
        const id = item.provider_id || item.id;
        const type = item.type || (item.first_air_date ? 'tv' : 'movie');

        fetch(`${API_BASE}/cinema/api/queue/add`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            dest: destToken,
            mediaType: type,
            mediaId: id,
            title: item.title || item.name,
            season,
            episode,
            playNext
          })
        })
          .then(r => r.json())
          .then(res => {
            refreshQueue();
            if (playNext) {
              alert(`▶️ "${item.title || item.name}" will play next in stream!`);
            } else {
              alert(`✅ Added to cinema queue!`);
            }
          });
      };

      return (
        <div className="flex flex-col min-h-screen pb-24">
          {/* Top App Bar */}
          <header className="sticky top-0 z-40 bg-[#0F0E17]/90 backdrop-blur-md border-b border-[#2E2B40] px-4 py-3 flex items-center justify-between">
            <div className="flex items-center space-x-2">
              <span className="text-xl">🎬</span>
              <div>
                <h1 className="text-sm font-bold tracking-wider text-white flex items-center gap-1.5">
                  PAPPY CINEMA
                  <span className="text-[10px] bg-[#E50914] text-white px-1.5 py-0.5 rounded font-extrabold">LIVE</span>
                </h1>
                <p className="text-[11px] text-gray-400">
                  {destination ? `📡 ${destination.title}` : 'Stream Remote'}
                </p>
              </div>
            </div>
            {playbackStatus && (
              <button
                onClick={() => setFullRemoteOpen(true)}
                className="flex items-center space-x-1.5 bg-[#1B1926] border border-[#FFB800]/40 text-[#FFB800] text-xs px-2.5 py-1.5 rounded-full font-medium active:scale-95 transition"
              >
                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>Remote</span>
              </button>
            )}
          </header>

          {/* Main Navigation Views */}
          <main className="flex-1 p-4">
            {activeTab === 'home' && (
              <div className="space-y-6">
                {/* Hero Feature Banner */}
                {homeData?.trending_movies?.[0] && (
                  <div
                    onClick={() => openDetails(homeData.trending_movies[0])}
                    className="relative rounded-2xl overflow-hidden aspect-[16/10] bg-gray-900 border border-[#2E2B40] shadow-2xl active:scale-[0.99] transition cursor-pointer"
                  >
                    <img
                      src={homeData.trending_movies[0].backdrop || homeData.trending_movies[0].poster}
                      className="w-full h-full object-cover opacity-80"
                      alt=""
                    />
                    <div className="absolute inset-0 bg-gradient-to-t from-[#0F0E17] via-transparent to-transparent flex flex-col justify-end p-4">
                      <span className="text-[11px] font-bold text-[#FFB800] uppercase tracking-wider mb-1">
                        Featured Movie • {homeData.trending_movies[0].year}
                      </span>
                      <h2 className="text-lg font-bold leading-tight line-clamp-1">
                        {homeData.trending_movies[0].title}
                      </h2>
                      <div className="flex items-center space-x-2 mt-2">
                        <span className="bg-[#E50914] text-white text-[10px] font-bold px-2 py-0.5 rounded">
                          ★ {homeData.trending_movies[0].rating}
                        </span>
                        <span className="text-xs text-gray-300">
                          {Array.isArray(homeData.trending_movies[0].genre) ? homeData.trending_movies[0].genre.join(', ') : 'Action, Adventure'}
                        </span>
                      </div>
                    </div>
                  </div>
                )}

                {/* Trending Movies Carousel */}
                <section>
                  <div className="flex items-center justify-between mb-3">
                    <h3 className="text-sm font-bold uppercase tracking-wider text-gray-300 flex items-center gap-1.5">
                      🔥 Trending Movies
                    </h3>
                  </div>
                  <div className="flex space-x-3 overflow-x-auto hide-scrollbar pb-2">
                    {homeData?.trending_movies?.map((m) => (
                      <div
                        key={m.provider_id || m.id}
                        onClick={() => openDetails(m)}
                        className="w-28 flex-shrink-0 cursor-pointer active:scale-95 transition"
                      >
                        <div className="aspect-[2/3] rounded-xl overflow-hidden bg-[#1B1926] border border-[#2E2B40]">
                          <img src={m.poster} className="w-full h-full object-cover" alt="" loading="lazy" />
                        </div>
                        <h4 className="text-xs font-medium mt-1.5 line-clamp-1">{m.title}</h4>
                        <span className="text-[10px] text-gray-400">★ {m.rating} • {m.year}</span>
                      </div>
                    ))}
                  </div>
                </section>

                {/* Trending Series Carousel */}
                <section>
                  <div className="flex items-center justify-between mb-3">
                    <h3 className="text-sm font-bold uppercase tracking-wider text-gray-300 flex items-center gap-1.5">
                      📺 TV Series & Anime
                    </h3>
                  </div>
                  <div className="flex space-x-3 overflow-x-auto hide-scrollbar pb-2">
                    {homeData?.trending_tv?.map((s) => (
                      <div
                        key={s.provider_id || s.id}
                        onClick={() => openDetails(s)}
                        className="w-28 flex-shrink-0 cursor-pointer active:scale-95 transition"
                      >
                        <div className="aspect-[2/3] rounded-xl overflow-hidden bg-[#1B1926] border border-[#2E2B40]">
                          <img src={s.poster} className="w-full h-full object-cover" alt="" loading="lazy" />
                        </div>
                        <h4 className="text-xs font-medium mt-1.5 line-clamp-1">{s.title || s.name}</h4>
                        <span className="text-[10px] text-gray-400">★ {s.rating} • {s.year}</span>
                      </div>
                    ))}
                  </div>
                </section>
              </div>
            )}

            {/* Search Tab */}
            {activeTab === 'search' && (
              <div className="space-y-4">
                <div className="relative">
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={e => setSearchQuery(e.target.value)}
                    placeholder="Search movies, anime, tv series..."
                    className="w-full bg-[#1B1926] border border-[#2E2B40] text-white text-sm rounded-xl px-4 py-3 pl-10 focus:outline-none focus:border-[#E50914] transition"
                  />
                  <span className="absolute left-3.5 top-3.5 text-gray-400">🔍</span>
                  {searchQuery && (
                    <button
                      onClick={() => setSearchQuery('')}
                      className="absolute right-3.5 top-3.5 text-gray-400 text-xs bg-gray-800 rounded-full w-5 h-5 flex items-center justify-center"
                    >
                      ✕
                    </button>
                  )}
                </div>

                {searchLoading ? (
                  <div className="text-center py-12 text-gray-400 text-sm">Searching cinema catalog...</div>
                ) : searchResults.length > 0 ? (
                  <div className="grid grid-cols-3 gap-3">
                    {searchResults.map((m) => (
                      <div
                        key={m.provider_id || m.id}
                        onClick={() => openDetails(m)}
                        className="cursor-pointer active:scale-95 transition"
                      >
                        <div className="aspect-[2/3] rounded-xl overflow-hidden bg-[#1B1926] border border-[#2E2B40]">
                          <img src={m.poster} className="w-full h-full object-cover" alt="" loading="lazy" />
                        </div>
                        <h4 className="text-xs font-medium mt-1.5 line-clamp-1">{m.title || m.name}</h4>
                        <span className="text-[10px] text-gray-400">★ {m.rating} • {m.year}</span>
                      </div>
                    ))}
                  </div>
                ) : searchQuery ? (
                  <div className="text-center py-12 text-gray-500 text-sm">No titles found for "{searchQuery}".</div>
                ) : (
                  <div className="text-center py-12 text-gray-500 text-sm">Type any title, director or actor to explore.</div>
                )}
              </div>
            )}

            {/* Queue Tab */}
            {activeTab === 'queue' && (
              <div className="space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-sm font-bold uppercase tracking-wider text-gray-300">
                    📜 Up Next in Stream ({queueItems.length})
                  </h3>
                  <button
                    onClick={refreshQueue}
                    className="text-xs text-[#FFB800] bg-[#1B1926] border border-[#2E2B40] px-2.5 py-1 rounded-lg"
                  >
                    Refresh
                  </button>
                </div>

                {queueItems.length === 0 ? (
                  <div className="text-center py-12 text-gray-500 text-sm bg-[#1B1926] rounded-2xl border border-[#2E2B40] p-6">
                    <p className="text-2xl mb-2">🍿</p>
                    <p className="font-semibold text-white">The queue is empty</p>
                    <p className="text-xs text-gray-400 mt-1">Browse movies or series and tap "Add to Queue".</p>
                  </div>
                ) : (
                  <div className="space-y-2">
                    {queueItems.map((item, idx) => (
                      <div
                        key={item.queue_item_id}
                        className="flex items-center justify-between p-3 bg-[#1B1926] border border-[#2E2B40] rounded-xl"
                      >
                        <div className="flex items-center space-x-3">
                          <span className="text-xs font-bold text-[#FFB800] w-5 text-center">
                            #{idx + 1}
                          </span>
                          <div>
                            <h4 className="text-xs font-semibold line-clamp-1">{item.title}</h4>
                            <p className="text-[10px] text-gray-400">
                              {item.media_type.toUpperCase()} {item.season && `• S${item.season}E${item.episode}`}
                            </p>
                          </div>
                        </div>
                        <button
                          onClick={() => {
                            fetch(`${API_BASE}/cinema/api/queue/remove`, {
                              method: 'POST',
                              headers: { 'Content-Type': 'application/json' },
                              body: JSON.stringify({ dest: destToken, queueItemId: item.queue_item_id })
                            }).then(() => refreshQueue());
                          }}
                          className="text-gray-400 hover:text-red-400 text-xs p-1"
                        >
                          ✕
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </main>

          {/* Persistent Mini-Player Bottom Dock */}
          {playbackStatus && (
            <div
              onClick={() => { haptic('selection'); setFullRemoteOpen(true); }}
              className="fixed bottom-16 left-3 right-3 bg-[#1B1926]/95 border border-[#2E2B40] backdrop-blur-md rounded-2xl p-2.5 flex items-center justify-between shadow-2xl z-40 active:scale-[0.99] transition cursor-pointer"
            >
              <div className="flex items-center space-x-3 overflow-hidden">
                <div className="w-10 h-10 rounded-lg bg-gray-800 flex items-center justify-center font-bold text-xs text-[#FFB800] border border-[#2E2B40]">
                  🎬
                </div>
                <div className="overflow-hidden">
                  <h4 className="text-xs font-bold text-white truncate">{playbackStatus.title}</h4>
                  <div className="flex items-center space-x-2 text-[10px] text-gray-400">
                    <span className={playbackStatus.state === 'PLAYING' ? 'text-emerald-400 font-semibold' : 'text-amber-400 font-semibold'}>
                      {playbackStatus.state}
                    </span>
                    <span>• {formatTime(playbackStatus.position)} / {formatTime(playbackStatus.duration)}</span>
                  </div>
                </div>
              </div>
              <div className="flex items-center space-x-2">
                <button
                  onClick={(e) => {
                    e.stopPropagation();
                    sendRemoteCommand(playbackStatus.state === 'PLAYING' ? 'pause' : 'resume');
                  }}
                  className="w-8 h-8 rounded-full bg-[#E50914] text-white flex items-center justify-center text-xs font-bold"
                >
                  {playbackStatus.state === 'PLAYING' ? '⏸' : '▶'}
                </button>
              </div>
            </div>
          )}

          {/* Bottom App Navigation Bar */}
          <nav className="fixed bottom-0 left-0 right-0 bg-[#0F0E17]/95 border-t border-[#2E2B40] backdrop-blur-lg px-6 py-2 flex items-center justify-around z-30">
            <button
              onClick={() => { haptic('selection'); setActiveTab('home'); }}
              className={`flex flex-col items-center py-1 ${activeTab === 'home' ? 'text-[#E50914]' : 'text-gray-400'}`}
            >
              <span className="text-lg">🏠</span>
              <span className="text-[10px] font-medium mt-0.5">Home</span>
            </button>
            <button
              onClick={() => { haptic('selection'); setActiveTab('search'); }}
              className={`flex flex-col items-center py-1 ${activeTab === 'search' ? 'text-[#E50914]' : 'text-gray-400'}`}
            >
              <span className="text-lg">🔍</span>
              <span className="text-[10px] font-medium mt-0.5">Search</span>
            </button>
            <button
              onClick={() => { haptic('selection'); setActiveTab('queue'); }}
              className={`flex flex-col items-center py-1 ${activeTab === 'queue' ? 'text-[#E50914]' : 'text-gray-400'}`}
            >
              <span className="text-lg">📜</span>
              <span className="text-[10px] font-medium mt-0.5">Queue</span>
            </button>
          </nav>

          {/* FULL MOVIE REMOTE MODAL (WITH DOUBLE-TAP FORWARDING) */}
          {fullRemoteOpen && playbackStatus && (
            <div className="fixed inset-0 bg-[#0F0E17] z-50 flex flex-col p-4 animate-in fade-in duration-200">
              {/* Remote Header */}
              <div className="flex items-center justify-between pb-4 border-b border-[#2E2B40]">
                <div>
                  <h3 className="text-sm font-bold text-white uppercase tracking-wider">🎛️ Cinema Stream Remote</h3>
                  <p className="text-[11px] text-gray-400">Double-tap left/right on player to seek</p>
                </div>
                <button
                  onClick={() => setFullRemoteOpen(false)}
                  className="w-8 h-8 rounded-full bg-[#1B1926] border border-[#2E2B40] text-gray-300 text-xs flex items-center justify-center"
                >
                  ✕
                </button>
              </div>

              {/* Interactive Player Screen with Double-Tap Gestures */}
              <div
                onClick={handlePlayerDoubleTap}
                className="relative mt-4 rounded-2xl aspect-video bg-gradient-to-br from-gray-900 to-[#1B1926] border border-[#2E2B40] flex items-center justify-center overflow-hidden shadow-2xl cursor-pointer"
              >
                {/* Visual Ripple Overlay for Double Tap */}
                {feedbackRipple && (
                  <div
                    className={`absolute inset-y-0 ${feedbackRipple.side === 'left' ? 'left-0 right-1/2' : 'right-0 left-1/2'} bg-white/10 flex items-center justify-center ripple-animate z-30`}
                  >
                    <span className="text-2xl font-black text-white bg-black/60 px-4 py-2 rounded-2xl backdrop-blur-md">
                      {feedbackRipple.text}
                    </span>
                  </div>
                )}

                <div className="text-center p-4">
                  <h2 className="text-lg font-bold text-white line-clamp-1">{playbackStatus.title}</h2>
                  <p className="text-xs text-[#FFB800] mt-1 font-semibold">
                    {playbackStatus.season ? `Season ${playbackStatus.season} • Episode ${playbackStatus.episode}` : 'Full Movie Broadcast'}
                  </p>
                  <span className="inline-block mt-3 px-3 py-1 rounded-full text-[11px] font-bold bg-[#E50914]/20 border border-[#E50914]/40 text-[#E50914]">
                    {playbackStatus.state}
                  </span>
                </div>

                <div className="absolute bottom-2 left-3 right-3 text-[10px] text-gray-500 flex justify-between pointer-events-none">
                  <span>⏪ Double-tap left (-10s)</span>
                  <span>Double-tap right (+10s) ⏩</span>
                </div>
              </div>

              {/* Authoritative Scrubber Slider */}
              <div className="mt-6 space-y-2">
                <div className="flex justify-between text-xs text-gray-400 font-mono">
                  <span>{formatTime(playbackStatus.position)}</span>
                  <span>{formatTime(playbackStatus.duration)}</span>
                </div>
                <input
                  type="range"
                  min="0"
                  max={playbackStatus.duration || 100}
                  value={playbackStatus.position || 0}
                  onChange={(e) => sendRemoteCommand('seek', { seconds: parseFloat(e.target.value) })}
                  className="w-full accent-[#E50914] bg-gray-700 h-2 rounded-lg cursor-pointer"
                />
              </div>

              {/* Physical Remote Control Buttons */}
              <div className="mt-6 grid grid-cols-5 gap-2">
                <button
                  onClick={() => sendRemoteCommand('seek_delta', { delta: -30 })}
                  className="bg-[#1B1926] border border-[#2E2B40] p-3 rounded-2xl text-xs font-bold active:scale-90 transition flex flex-col items-center"
                >
                  <span>⏪</span>
                  <span className="text-[10px] text-gray-400 mt-1">-30s</span>
                </button>
                <button
                  onClick={() => sendRemoteCommand('seek_delta', { delta: -10 })}
                  className="bg-[#1B1926] border border-[#2E2B40] p-3 rounded-2xl text-xs font-bold active:scale-90 transition flex flex-col items-center"
                >
                  <span>◀️</span>
                  <span className="text-[10px] text-gray-400 mt-1">-10s</span>
                </button>
                <button
                  onClick={() => sendRemoteCommand(playbackStatus.state === 'PLAYING' ? 'pause' : 'resume')}
                  className="bg-[#E50914] p-3 rounded-2xl text-base font-extrabold text-white active:scale-90 transition flex flex-col items-center justify-center shadow-lg shadow-red-900/40"
                >
                  {playbackStatus.state === 'PLAYING' ? '⏸' : '▶'}
                </button>
                <button
                  onClick={() => sendRemoteCommand('seek_delta', { delta: 10 })}
                  className="bg-[#1B1926] border border-[#2E2B40] p-3 rounded-2xl text-xs font-bold active:scale-90 transition flex flex-col items-center"
                >
                  <span>▶️</span>
                  <span className="text-[10px] text-gray-400 mt-1">+10s</span>
                </button>
                <button
                  onClick={() => sendRemoteCommand('seek_delta', { delta: 30 })}
                  className="bg-[#1B1926] border border-[#2E2B40] p-3 rounded-2xl text-xs font-bold active:scale-90 transition flex flex-col items-center"
                >
                  <span>⏩</span>
                  <span className="text-[10px] text-gray-400 mt-1">+30s</span>
                </button>
              </div>

              {/* Specialized Action Controls */}
              <div className="mt-4 grid grid-cols-2 gap-3">
                <button
                  onClick={() => sendRemoteCommand('skip_intro', { seconds: 85 })}
                  className="bg-[#1B1926] border border-[#FFB800]/40 text-[#FFB800] p-3 rounded-xl text-xs font-bold flex items-center justify-center space-x-2 active:scale-95 transition"
                >
                  <span>⏭️</span>
                  <span>Skip Intro (+85s)</span>
                </button>
                <button
                  onClick={() => {
                    if (confirm('Stop cinema voice chat playback?')) {
                      sendRemoteCommand('stop');
                      setFullRemoteOpen(false);
                    }
                  }}
                  className="bg-red-950/40 border border-red-800/40 text-red-400 p-3 rounded-xl text-xs font-bold flex items-center justify-center space-x-2 active:scale-95 transition"
                >
                  <span>⏹️</span>
                  <span>Stop Stream</span>
                </button>
              </div>
            </div>
          )}

          {/* ITEM DETAIL & QUEUE DRAWER MODAL */}
          {selectedItem && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex flex-col justify-end">
              <div className="bg-[#1B1926] border-t border-[#2E2B40] rounded-t-3xl max-h-[85vh] flex flex-col overflow-hidden animate-in slide-in-from-bottom duration-200">
                <div className="relative aspect-[16/9] bg-gray-900">
                  <img
                    src={selectedItem.backdrop || selectedItem.poster}
                    className="w-full h-full object-cover"
                    alt=""
                  />
                  <button
                    onClick={() => setSelectedItem(null)}
                    className="absolute top-3 right-3 w-8 h-8 rounded-full bg-black/60 text-white flex items-center justify-center text-xs"
                  >
                    ✕
                  </button>
                </div>

                <div className="p-4 overflow-y-auto space-y-4">
                  <div>
                    <h3 className="text-base font-bold text-white">{selectedItem.title || selectedItem.name}</h3>
                    <p className="text-xs text-gray-400 mt-0.5">
                      ★ {selectedItem.rating} • {selectedItem.year || selectedItem.release_date}
                    </p>
                    <p className="text-xs text-gray-300 mt-2 line-clamp-3">
                      {selectedItem.overview || itemDetails?.overview || 'High-fidelity cinema stream ready.'}
                    </p>
                  </div>

                  {/* Actions */}
                  <div className="grid grid-cols-3 gap-2 pt-2">
                    <button
                      onClick={() => handlePlayNowAction(selectedItem)}
                      className="bg-[#E50914] text-white py-3 rounded-xl text-xs font-bold active:scale-95 transition flex items-center justify-center space-x-1"
                    >
                      <span>🎬</span>
                      <span>Play Now</span>
                    </button>
                    <button
                      onClick={() => handleQueueAction(selectedItem, true)}
                      className="bg-[#FFB800] text-black py-3 rounded-xl text-xs font-bold active:scale-95 transition flex items-center justify-center space-x-1"
                    >
                      <span>▶️</span>
                      <span>Play Next</span>
                    </button>
                    <button
                      onClick={() => handleQueueAction(selectedItem, false)}
                      className="bg-[#2E2B40] text-white py-3 rounded-xl text-xs font-bold active:scale-95 transition flex items-center justify-center space-x-1"
                    >
                      <span>➕</span>
                      <span>Queue</span>
                    </button>
                  </div>

                  {/* TV Episodes Drawer if TV Series */}
                  {selectedItem.type === 'tv' && (
                    <div className="mt-4 pt-4 border-t border-[#2E2B40]">
                      <h4 className="text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">Select Episode</h4>
                      <div className="space-y-2">
                        {seasonEpisodes.slice(0, 15).map(ep => (
                          <div
                            key={ep.episode_number || ep.id}
                            className="flex items-center justify-between p-2.5 bg-[#0F0E17] rounded-xl border border-[#2E2B40]"
                          >
                            <span className="text-xs font-medium line-clamp-1">
                              E{ep.episode_number}: {ep.name || ep.title || `Episode ${ep.episode_number}`}
                            </span>
                            <div className="flex items-center space-x-1.5">
                              <button
                                onClick={() => handlePlayNowAction(selectedItem, selectedSeason, ep.episode_number)}
                                className="text-[11px] font-bold text-white bg-[#E50914] px-2.5 py-1 rounded-lg active:scale-95"
                              >
                                Play
                              </button>
                              <button
                                onClick={() => handleQueueAction(selectedItem, true, selectedSeason, ep.episode_number)}
                                className="text-[11px] text-[#FFB800] bg-[#1B1926] px-2.5 py-1 rounded-lg border border-[#2E2B40] active:scale-95"
                              >
                                Next
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
