# Independent BrowserOS Neo execution service for Lancy AI
# Stores persistent browser profiles, logins, downloads, and recordings under /data/browseros
# (never on the root filesystem).
services:
  lancy-browseros-neo:
    image: ${NEO_IMAGE:-ghcr.io/browseros-ai/neo}:${NEO_VERSION:-latest}
    container_name: lancy-browseros-neo
    init: false
    shm_size: 1g
    hostname: neo
    stop_grace_period: 20s
    ports:
      - "127.0.0.1:${NEO_VNC_PORT:-6080}:6080"
      - "127.0.0.1:${NEO_MCP_PORT:-9010}:9010"
    volumes:
      - "${BROWSEROS_DATA_DIR:-/data/browseros}:/data"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      NEO_SCREEN: ${NEO_SCREEN:-1280x720}
      BROWSERCLAW_HOSTED_MODE: ${BROWSERCLAW_HOSTED_MODE:-1}
      NEO_SANDBOX: ${NEO_SANDBOX:-false}
      NEO_SOFTWARE_GRAPHICS: ${NEO_SOFTWARE_GRAPHICS:-true}
      NEO_DISABLE_BROWSEROS_EXTENSIONS: ${NEO_DISABLE_BROWSEROS_EXTENSIONS:-true}
      CLAW_ANALYTICS_ENABLED: "0"
    restart: unless-stopped
